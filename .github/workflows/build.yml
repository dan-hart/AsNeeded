# Clean clone build - proves the app builds from a fresh checkout with nothing configured.
#
# The RevenueCat public SDK key is never committed (see Config/Secrets.example.xcconfig). Pushes to this
# repository can supply it through the REVENUECAT_API_KEY repository secret, which the job writes into the
# gitignored Config/Secrets.xcconfig and then verifies reached the built Info.plist. Pull requests never receive secrets, so they exercise the keyless path, and the job verifies that too.

name: Build

on:
  push:
    branches: [main, develop, task/v1.2.0, task/v1.3.0]
  pull_request:
    branches: [main, develop, task/v1.2.0, task/v1.3.0]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean-clone-build:
    name: Clean clone build (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode 26.4.1
        id: toolchain
        run: |
          printf 'TEST_DERIVED_DATA_PATH=%s\nTEST_PINNED_PACKAGES_PATH=%s\nTEST_RESULT_BUNDLE_PATH=%s\n' \
            "$RUNNER_TEMP/asneeded-derived-data" "$RUNNER_TEMP/asneeded-source-packages" \
            "$RUNNER_TEMP/asneeded-tests.xcresult" >> "$GITHUB_ENV"
          test -d /Applications/Xcode_26.4.1.app
          sudo xcode-select -s /Applications/Xcode_26.4.1.app
          xcodebuild -version

      - name: Write local secrets from the repository secret
        id: configuration
        env:
          REVENUECAT_API_KEY: ${{ github.event_name == 'push' && secrets.REVENUECAT_API_KEY || '' }}
        run: |
          if [ -n "$REVENUECAT_API_KEY" ]; then
            printf 'REVENUECAT_API_KEY = %s\n' "$REVENUECAT_API_KEY" > Config/Secrets.xcconfig
            echo "has_key=true" >> "$GITHUB_ENV"
            echo "Repository RevenueCat key available; building with tipping enabled."
          else
            echo "has_key=false" >> "$GITHUB_ENV"
            echo "No RevenueCat key available; building the keyless path a contributor sees."
          fi

      - name: Select an installed iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path

          def version(value):
              parts = tuple(int(part) for part in value.replace("-", ".").split("."))
              return parts + (0,) * (3 - len(parts))

          # Require compatibility with every configured iOS deployment target.
          project = Path("AsNeeded.xcodeproj/project.pbxproj").read_text()
          minimum = max(version(value) for value in re.findall(r"IPHONEOS_DEPLOYMENT_TARGET\s*=\s*([0-9.]+);", project))

          devices = json.loads((Path(os.environ["RUNNER_TEMP"]) / "simulators.json").read_text())["devices"]
          candidates = [device for runtime, entries in devices.items()
                        if ".iOS-" in runtime and version(runtime.rsplit(".iOS-", 1)[1]) >= minimum
                        for device in entries if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not candidates:
              raise SystemExit("No compatible available iPhone simulator for the project deployment target in the selected Xcode runtime")
          destination = "platform=iOS Simulator,id=" + candidates[0]["udid"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("TEST_DESTINATION=" + destination + "\n")
          print("Selected " + candidates[0]["name"])
          PYTHON

      - name: Resolve packages
        id: packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AsNeeded.xcodeproj \
            -scheme AsNeeded \
            -clonedSourcePackagesDirPath "$TEST_PINNED_PACKAGES_PATH" \
            -onlyUsePackageVersionsFromResolvedFile

      # Keep the simulator’s default ad-hoc signing so its app group is available during tests.
      - name: Build app and test host
        id: build
        run: |
          xcodebuild build-for-testing \
            -project AsNeeded.xcodeproj \
            -scheme AsNeeded \
            -configuration Debug \
            -destination "$TEST_DESTINATION" \
            -derivedDataPath "$TEST_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$TEST_PINNED_PACKAGES_PATH" \
            -onlyUsePackageVersionsFromResolvedFile \
            -quiet

      - name: Verify the RevenueCat key handling in the built app
        id: key-check
        run: |
          APP="$TEST_DERIVED_DATA_PATH/Build/Products/Debug-iphonesimulator/AsNeeded.app"
          test -d "$APP" || { echo "Built app not found"; exit 1; }
          if [ "$has_key" = "true" ]; then
            ./scripts/verify-release-key.sh "$APP"
          else
            ./scripts/verify-release-key.sh --expect-empty "$APP"
          fi

      - name: Run the full simulator suite
        id: tests
        env:
          TEST_WITHOUT_BUILDING: '1'
          # Use one simulator to avoid preferences writes failing in parallel clones.
          TEST_PARALLEL_ENABLED: 'NO'
          TEST_WORKERS: '1'
        run: ./scripts/test-parallel.sh

      - name: Summarize simulator checks
        id: report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          CI_TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          CI_CONFIGURATION_OUTCOME: ${{ steps.configuration.outcome }}
          CI_SIMULATOR_OUTCOME: ${{ steps.simulator.outcome }}
          CI_PACKAGES_OUTCOME: ${{ steps.packages.outcome }}
          CI_BUILD_OUTCOME: ${{ steps.build.outcome }}
          CI_KEY_CHECK_OUTCOME: ${{ steps.key-check.outcome }}
          CI_TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: python3 scripts/ci-test-summary.py "$TEST_RESULT_BUNDLE_PATH" "$RUNNER_TEMP/asneeded-test-report.json"

      - name: Upload the allowlisted test report
        if: ${{ !cancelled() && (steps.report.outcome == 'success' || steps.report.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simulator-test-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/asneeded-test-report.json
          retention-days: 7
          if-no-files-found: error

  fast-regressions:
    name: Fast tooling regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Python and shell regressions
        run: |
          for test in scripts/tests/*test*.py; do
            python3 "$test"
          done
          python3 -m unittest discover -s scripts/localization -p 'test_*.py'
          ./scripts/tests/setup-codex-superpowers.test.sh

  standalone-tests:
    name: Standalone regressions
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode 26.4.1
        run: |
          test -d /Applications/Xcode_26.4.1.app
          sudo xcode-select -s /Applications/Xcode_26.4.1.app
          xcodebuild -version

      - name: Watch-model regressions
        run: ./scripts/tests/watch-medication-availability.test.sh
