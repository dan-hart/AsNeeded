# Clean clone build - proves the app builds from a fresh checkout with nothing configured.
#
# The RevenueCat public SDK key is never committed (see Config/Secrets.example.xcconfig). Pushes to this
# repository can supply it through the REVENUECAT_API_KEY repository secret, which the job writes into the
# gitignored Config/Secrets.xcconfig and then verifies reached the built Info.plist. Pull requests never receive secrets, so they exercise the keyless path, and the job verifies that too.

name: Build

on:
  push:
    branches: [main, develop, task/v1.2.0, task/v1.3.0]
  pull_request:
    branches: [main, develop, task/v1.2.0, task/v1.3.0]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean-clone-build:
    name: Clean clone build (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SIMULATOR_DESTINATION: generic/platform=iOS Simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.4.1
        run: |
          test -d /Applications/Xcode_26.4.1.app
          sudo xcode-select -s /Applications/Xcode_26.4.1.app
          xcodebuild -version

      - name: Write local secrets from the repository secret
        env:
          REVENUECAT_API_KEY: ${{ github.event_name == 'push' && secrets.REVENUECAT_API_KEY || '' }}
        run: |
          if [ -n "$REVENUECAT_API_KEY" ]; then
            printf 'REVENUECAT_API_KEY = %s\n' "$REVENUECAT_API_KEY" > Config/Secrets.xcconfig
            echo "has_key=true" >> "$GITHUB_ENV"
            echo "Repository RevenueCat key available; building with tipping enabled."
          else
            echo "has_key=false" >> "$GITHUB_ENV"
            echo "No RevenueCat key available; building the keyless path a contributor sees."
          fi

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project AsNeeded.xcodeproj -scheme AsNeeded -onlyUsePackageVersionsFromResolvedFile

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project AsNeeded.xcodeproj \
            -scheme AsNeeded \
            -configuration Debug \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath build/DerivedData \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Verify the RevenueCat key handling in the built app
        run: |
          APP=$(find build/DerivedData/Build/Products -maxdepth 2 -name AsNeeded.app | head -1)
          test -n "$APP" || { echo "Built app not found"; exit 1; }
          if [ "$has_key" = "true" ]; then
            ./scripts/verify-release-key.sh "$APP"
          else
            ./scripts/verify-release-key.sh --expect-empty "$APP"
          fi

      - name: Select an installed iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path

          def version(value):
              parts = tuple(int(part) for part in value.replace("-", ".").split("."))
              return parts + (0,) * (3 - len(parts))

          # Require compatibility with every configured iOS deployment target.
          project = Path("AsNeeded.xcodeproj/project.pbxproj").read_text()
          minimum = max(version(value) for value in re.findall(r"IPHONEOS_DEPLOYMENT_TARGET\s*=\s*([0-9.]+);", project))

          devices = json.loads((Path(os.environ["RUNNER_TEMP"]) / "simulators.json").read_text())["devices"]
          candidates = [device for runtime, entries in devices.items()
                        if ".iOS-" in runtime and version(runtime.rsplit(".iOS-", 1)[1]) >= minimum
                        for device in entries if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not candidates:
              raise SystemExit("No compatible available iPhone simulator for the project deployment target in the selected Xcode runtime")
          destination = "platform=iOS Simulator,id=" + candidates[0]["udid"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("TEST_DESTINATION=" + destination + "\n")
          print("Selected " + candidates[0]["name"])
          PYTHON

      - name: Unit tests
        env:
          TEST_WORKERS: '2'
        run: ./scripts/test-parallel.sh

  standalone-tests:
    name: Standalone regressions
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.4.1
        run: |
          test -d /Applications/Xcode_26.4.1.app
          sudo xcode-select -s /Applications/Xcode_26.4.1.app
          xcodebuild -version

      - name: Python regressions
        run: |
          for test in scripts/tests/*test*.py; do
            python3 "$test"
          done
          python3 -m unittest discover -s scripts/localization -p 'test_*.py'

      - name: Shell and watch-model regressions
        run: |
          ./scripts/tests/setup-codex-superpowers.test.sh
          ./scripts/tests/watch-medication-availability.test.sh
